<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#F8FAFC"/>
  <!-- Bread Loaf Package Base -->
  <rect x="45" y="40" width="110" height="120" rx="12" fill="#1E40AF" stroke="#1D4ED8" stroke-width="2"/>
  <!-- Wheat Brown Top Header -->
  <path d="M 45 52 C 45 40, 155 40, 155 52 L 155 85 L 45 85 Z" fill="#D97706"/>
  <!-- Britannia Logo Banner -->
  <rect x="60" y="48" width="80" height="22" rx="4" fill="#DC2626"/>
  <text x="100" y="63" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BRITANNIA</text>
  <!-- 100% Whole Wheat Badge -->
  <rect x="55" y="74" width="90" height="14" rx="3" fill="#FEF3C7"/>
  <text x="100" y="85" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#92400E" text-anchor="middle">100% WHOLE WHEAT</text>
  <!-- Window preview with bread slices -->
  <rect x="55" y="94" width="90" height="52" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Sliced Bread Texture -->
  <rect x="65" y="102" width="16" height="36" rx="4" fill="#B45309"/>
  <rect x="85" y="102" width="16" height="36" rx="4" fill="#D97706"/>
  <rect x="105" y="102" width="16" height="36" rx="4" fill="#B45309"/>
  <rect x="125" y="102" width="10" height="36" rx="3" fill="#92400E"/>
  <!-- Package Seal Trim -->
  <rect x="45" y="152" width="110" height="8" fill="#1D4ED8"/>
</svg>
