<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#FFFBEB"/>
  <!-- Maggi Pack Base (Iconic Yellow) -->
  <rect x="35" y="45" width="130" height="110" rx="10" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
  <!-- Red Top Wave -->
  <path d="M 35 45 Q 100 60 165 45 L 165 80 L 35 80 Z" fill="#DC2626"/>
  <!-- Maggi Red Oval Logo -->
  <ellipse cx="100" cy="62" rx="36" ry="16" fill="#FACC15" stroke="#DC2626" stroke-width="2"/>
  <text x="100" y="67" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#DC2626" text-anchor="middle" font-style="italic">Maggi</text>
  <!-- 2-Minute Noodle Badge -->
  <rect x="45" y="88" width="55" height="18" rx="4" fill="#DC2626"/>
  <text x="72" y="101" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle">2-MINUTE</text>
  <!-- Bowl Graphic -->
  <path d="M 105 118 Q 105 140 135 140 Q 160 140 160 118 Z" fill="#DC2626"/>
  <!-- Steaming Noodles inside bowl -->
  <path d="M 110 118 C 115 110, 125 122, 130 114 C 135 122, 145 110, 155 118" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 115 124 C 120 118, 130 128, 140 120 C 145 126, 150 118, 155 124" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Masala Text -->
  <text x="62" y="122" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#1E293B">MASALA</text>
  <text x="62" y="134" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#475569">NOODLES</text>
  <!-- 4 Pack Badge -->
  <circle cx="48" cy="142" r="10" fill="#16A34A"/>
  <text x="48" y="145" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle">4x</text>
</svg>
