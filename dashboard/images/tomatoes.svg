  <circle cx="95" cy="110" r="42" fill="#E11D48"/>
  <circle cx="85" cy="98" r="36" fill="#F43F5E"/>
  <!-- Tomato Highlight -->
  <ellipse cx="78" cy="90" rx="12" ry="7" fill="#FCA5A5" opacity="0.6" transform="rotate(-30 78 90)"/>
  <!-- Green Calyx Stem -->
